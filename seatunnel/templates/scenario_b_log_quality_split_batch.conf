# =============================================================================
# 场景 B：日志清洗异常分流、拒绝率监督（>20% 触发硬中断）与受管影子表回滚模板
# 引擎版本：Apache SeaTunnel Zeta 2.3.9
# 安全约束：所有凭据使用 ${SECRET:...} 占位符；违规原始行经脱敏策略写入错误表。
# =============================================================================

env {
  job.mode = "BATCH"
  job.name = "scenario_b_log_anomaly_quality_split_batch"
  parallelism = 2
  checkpoint.interval = 15000
}

source {
  Jdbc {
    url = "jdbc:mysql://demo-mysql:3306/demo_oltp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "etl_readonly"
    password = "${SECRET:MYSQL_SOURCE_PASSWORD}"
    query = """
      SELECT
        log_id,
        event_time,
        service_name,
        http_status,
        latency_ms,
        client_ip_masked,
        trace_id
      FROM app_access_logs
    """
    fetch_size = 5000
    result_table_name = "raw_access_logs"
  }
}

transform {
  # Stage 1 合法日志分流至影子表 ods_access_logs__shadow_exec002
  Sql {
    source_table_name = "raw_access_logs"
    result_table_name = "valid_shadow_logs"
    query = """
      SELECT
        log_id,
        event_time,
        service_name,
        http_status,
        latency_ms,
        client_ip_masked,
        trace_id
      FROM raw_access_logs
      WHERE log_id IS NOT NULL
        AND service_name IS NOT NULL
        AND http_status >= 100
        AND http_status <= 599
        AND latency_ms >= 0
        AND latency_ms <= 600000
    """
  }

  # Stage 1 异常格式/越界日志分流至错误表 ods_access_logs__error（供 RuntimeSupervision 计算 reject_rate）
  Sql {
    source_table_name = "raw_access_logs"
    result_table_name = "rejected_error_logs"
    query = """
      SELECT
        'exec_scenario_b' AS execution_id,
        'rule_log_status_and_latency' AS rule_id,
        'DQ_RANGE_VIOLATION' AS error_code,
        'Invalid HTTP status or negative/overflow latency_ms' AS reason_summary,
        CAST(log_id AS STRING) AS raw_payload_redacted,
        CURRENT_TIMESTAMP AS detected_at
      FROM raw_access_logs
      WHERE log_id IS NULL
         OR service_name IS NULL
         OR http_status < 100
         OR http_status > 599
         OR latency_ms < 0
         OR latency_ms > 600000
    """
  }
}

sink {
  Doris {
    source_table_name = "valid_shadow_logs"
    fenodes = "doris-fe:8030"
    query-port = 9030
    username = "etl_writer"
    password = "${SECRET:DORIS_SINK_PASSWORD}"
    database = "demo_dw"
    table = "ods_access_logs__shadow_exec002"
    sink.label-prefix = "st_scenario_b_shadow"
    sink.enable-2pc = "true"
    sink.enable-delete = "false"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }

  Doris {
    source_table_name = "rejected_error_logs"
    fenodes = "doris-fe:8030"
    query-port = 9030
    username = "etl_writer"
    password = "${SECRET:DORIS_SINK_PASSWORD}"
    database = "demo_dw"
    table = "ods_access_logs__error"
    sink.label-prefix = "st_scenario_b_error"
    sink.enable-2pc = "true"
    sink.enable-delete = "false"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
