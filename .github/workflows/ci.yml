# ==============================================================================
# ETL-Agent 平台 — GitHub Actions 持续集成流水线 (.github/workflows/ci.yml)
# ==============================================================================
# 覆盖检查项：
#   1. Layer 0 契约与基线不可变性测试 (tests/contracts/)
#   2. Docker Compose 静态拓扑校验与密钥防泄漏静态扫描
#   3. 后端 Python 3.12 语法/Lint 检查与全模块单元测试 (backend/tests/)
#   4. 前端 Vue 3 + TypeScript 类型检查、Vitest 单测与 Vite 构建验证 (frontend/)
# 说明：L2 重型容器全链路集成测试需要完整真实数据库/SeaTunnel/Doris/Vault 环境，
#       通过 workflow_dispatch 独立触发，绝不在此普通 CI 中用 Mock 冒充 L2 已通过。
# ==============================================================================

name: ETL-Agent CI

on:
  push:
    branches: ["main", "master", "agent/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 契约完整性与密码学测试向量验证
  # ----------------------------------------------------------------------------
  contract-tests:
    name: Layer 0 Contract & Crypto Vector Tests
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码库
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装契约测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml jsonschema

      - name: 执行 Layer 0 契约验证套件
        run: |
          python -m pytest tests/contracts/ -v

  # ----------------------------------------------------------------------------
  # Job 2: Compose 拓扑配置校验与安全静态检查
  # ----------------------------------------------------------------------------
  compose-and-security-static:
    name: Compose Config & Static Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码库
        uses: actions/checkout@v4

      - name: 校验 compose.yaml 静态语法与依赖完整性
        run: |
          docker compose --env-file .env.example config --quiet

      - name: 校验默认启动服务列表与端口 127.0.0.1 绑定约束
        run: |
          python3 - << 'PY'
          import pathlib, sys, yaml

          compose = yaml.safe_load(pathlib.Path("compose.yaml").read_text(encoding="utf-8"))
          services = compose.get("services", {})
          required_defaults = {
              "frontend", "api", "celery-worker", "celery-beat", "outbox-dispatcher",
              "postgres", "redis", "vault", "minio", "mailpit",
              "seatunnel-zeta", "demo-mysql", "demo-postgres", "doris-fe", "doris-be",
              "otel-collector", "prometheus", "loki", "tempo", "grafana",
          }
          default_services = {
              name for name, cfg in services.items() if not cfg.get("profiles")
          }
          missing = required_defaults - default_services
          assert not missing, f"缺少默认启动服务: {missing}"

          for name, cfg in services.items():
              assert "healthcheck" in cfg, f"服务 {name} 缺少 healthcheck"
              for port_mapping in cfg.get("ports", []):
                  assert str(port_mapping).startswith("127.0.0.1:"), (
                      f"服务 {name} 端口映射未严格绑定至 127.0.0.1: {port_mapping}"
                  )
          print("Compose 服务完整性与 127.0.0.1 端口隔离静态验证通过。")
          PY

  # ----------------------------------------------------------------------------
  # Job 3: 后端 Python 3.12 静态检查与单元测试
  # ----------------------------------------------------------------------------
  backend-unit-tests:
    name: Backend Python 3.12 Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: [contract-tests]
    steps:
      - name: 检出代码库
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖与测试工具
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/pyproject.toml ]; then
            pip install -e "./backend[dev]" || pip install -e "./backend"
          fi
          pip install pytest pyyaml jsonschema cryptography pyjwt sqlglot pyhocon httpx pydantic pydantic-settings sqlalchemy

      - name: Python 字节码与语法静态检查
        run: |
          if [ -d backend/app ]; then
            python -m compileall -q backend/app
          fi

      - name: 执行后端单元测试套件
        run: |
          if [ -d backend/tests ]; then
            PYTHONPATH=backend python -m pytest backend/tests/ -v -k "not postgres_live and not l2_live"
          fi

  # ----------------------------------------------------------------------------
  # Job 4: 前端 TypeScript 类型检查、Vitest 单元测试与生产构建
  # ----------------------------------------------------------------------------
  frontend-typecheck-and-build:
    name: Frontend Typecheck, Vitest & Vite Build
    runs-on: ubuntu-latest
    needs: [contract-tests]
    steps:
      - name: 检出代码库
        uses: actions/checkout@v4

      - name: 安装 pnpm 9.12.3
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 执行前端依赖安装、类型检查、单测与生产构建
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            pnpm install --frozen-lockfile=false
            pnpm run typecheck
            pnpm test -- --run
            pnpm run build
          fi
