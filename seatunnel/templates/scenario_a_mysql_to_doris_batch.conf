# =============================================================================
# 场景 A：MySQL 8.0 -> Apache Doris 2.1.7 订单用户宽表批处理同步与两阶段质量分流模板
# 引擎版本：Apache SeaTunnel Zeta 2.3.9
# 安全约束：严禁包含任何明文密码，所有敏感凭据统一使用 ${SECRET:...} 占位符，
#           仅在 Worker 内存提交至 Zeta 的最短生命周期内由 SecretProvider 物化。
# =============================================================================

env {
  job.mode = "BATCH"
  job.name = "scenario_a_mysql_to_doris_wide_order_batch"
  parallelism = 2
  checkpoint.interval = 30000
}

source {
  Jdbc {
    url = "jdbc:mysql://demo-mysql:3306/demo_oltp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "etl_readonly"
    password = "${SECRET:MYSQL_SOURCE_PASSWORD}"
    query = """
      SELECT
        o.order_id,
        o.user_id,
        u.user_tier,
        u.region_code,
        o.order_status,
        o.total_amount,
        o.currency_code,
        o.updated_at
      FROM orders o
      INNER JOIN users u ON o.user_id = u.user_id
    """
    fetch_size = 2000
    result_table_name = "raw_wide_orders"
  }
}

transform {
  # Stage 1 流式行级合法记录分流：进入目标影子表 dwd_order_user_wide__shadow_exec001
  Sql {
    source_table_name = "raw_wide_orders"
    result_table_name = "valid_shadow_orders"
    query = """
      SELECT
        order_id,
        user_id,
        user_tier,
        region_code,
        order_status,
        total_amount,
        currency_code,
        updated_at
      FROM raw_wide_orders
      WHERE order_id IS NOT NULL
        AND user_id IS NOT NULL
        AND total_amount >= 0
        AND total_amount <= 10000000
    """
  }

  # Stage 1 流式行级违规记录分流：附带错误码与脱敏摘要进入错误表 dwd_order_user_wide__error
  Sql {
    source_table_name = "raw_wide_orders"
    result_table_name = "rejected_error_orders"
    query = """
      SELECT
        'exec_scenario_a' AS execution_id,
        'rule_order_amount_and_not_null' AS rule_id,
        'DQ_RANGE_VIOLATION' AS error_code,
        'Order amount out of range or key is null' AS reason_summary,
        CAST(order_id AS STRING) AS raw_payload_redacted,
        CURRENT_TIMESTAMP AS detected_at
      FROM raw_wide_orders
      WHERE order_id IS NULL
         OR user_id IS NULL
         OR total_amount < 0
         OR total_amount > 10000000
    """
  }
}

sink {
  # 目标影子表（待 Stage 2 影子表质量校验与 Schema 兼容门禁通过后执行原子 REPLACE Swap）
  Doris {
    source_table_name = "valid_shadow_orders"
    fenodes = "doris-fe:8030"
    query-port = 9030
    username = "etl_writer"
    password = "${SECRET:DORIS_SINK_PASSWORD}"
    database = "demo_dw"
    table = "dwd_order_user_wide__shadow_exec001"
    sink.label-prefix = "st_scenario_a_shadow"
    sink.enable-2pc = "true"
    sink.enable-delete = "false"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }

  # 目标质量错误表
  Doris {
    source_table_name = "rejected_error_orders"
    fenodes = "doris-fe:8030"
    query-port = 9030
    username = "etl_writer"
    password = "${SECRET:DORIS_SINK_PASSWORD}"
    database = "demo_dw"
    table = "dwd_order_user_wide__error"
    sink.label-prefix = "st_scenario_a_error"
    sink.enable-2pc = "true"
    sink.enable-delete = "false"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
