# =============================================================================
# Apache Doris 2.1.7 Frontend (FE) 定制配置 (infra/doris/fe/custom_fe.conf)
# 用途：约束 JVM 堆内存上限 (-Xmx2048m)，启用原子替换表与影子表发布能力
# =============================================================================

LOG_DIR = ${DORIS_HOME}/log
meta_dir = /opt/apache-doris/fe/doris-meta

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# 显式限制 FE JVM 堆内存，确保本机全服务并存时不发生内存争用
JAVA_OPTS = "-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xss4m -Xms1024m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

# 单节点开发与集成测试模式下允许单副本创建表
default_replication_num = 1
enable_concurrent_update = true
