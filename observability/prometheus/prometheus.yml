# Prometheus 抓取配置（ETL-Agent 本地可观测性栈）
# 指标命名遵循 contracts/observability/telemetry_spec.md 第 3 节规范

global:
  # 默认抓取与评估间隔
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: "etl-agent"
    environment: "local"

scrape_configs:
  # 1. Prometheus 自身健康指标
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. FastAPI 控制面应用 /metrics 端点
  - job_name: "etl-agent-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "etl-agent-api"
          plane: "control"

  # 3. OpenTelemetry Collector 导出的应用与 Worker 指标
  - job_name: "otel-collector"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"

  # 4. Tempo 自身运行指标
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: "tempo"

  # 5. Loki 自身运行指标
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: "loki"
