# =============================================================================
# Apache Doris 2.1.7 Backend (BE) 定制配置 (infra/doris/be/custom_be.conf)
# 用途：约束 BE 内存上限 (mem_limit=4G)，适配本机单 FE + 单 BE 容器拓扑
# =============================================================================

PPROF_TMPDIR = ${DORIS_HOME}/log
storage_root_path = /opt/apache-doris/be/storage

be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# 显式约束 BE 进程内存上限，防止单容器耗尽宿主机内存
mem_limit = 4G
storage_flood_stage_usage_percent = 95
storage_flood_stage_left_capacity_bytes = 1073741824
enable_java_support = false
