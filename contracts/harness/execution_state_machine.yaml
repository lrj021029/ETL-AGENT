contract_version: "1.0.0"
owner: "Lead / Architect + Security + Data"
description: >
  Unified ExecutionRun entity with separate state machines for BATCH and CDC.
  Terminal and reconciliation guards MUST be enforced in domain code.

batch:
  initial: CREATED
  terminal_states: [SUCCEEDED, CANCELLED, INTERRUPTED, FAILED, ROLLED_BACK]
  states:
    CREATED: [QUEUED, CANCELLED, FAILED]
    QUEUED: [SUBMITTING, CANCEL_REQUESTED, CANCELLED, FAILED]
    SUBMITTING: [RUNNING, UNKNOWN, FAILED, CANCEL_REQUESTED]
    UNKNOWN: [RECONCILING, FAILED, CANCEL_REQUESTED]
    RECONCILING: [RUNNING, VALIDATING, SUCCEEDED, FAILED, INTERRUPTED, CANCELLED, UNKNOWN]
    RUNNING: [VALIDATING, PAUSE_REQUESTED, CANCEL_REQUESTED, INTERRUPTED, FAILED, UNKNOWN]
    PAUSE_REQUESTED: [PAUSED, RUNNING, INTERRUPTED, FAILED, CANCEL_REQUESTED]
    PAUSED: [RUNNING, CANCEL_REQUESTED, CANCELLED, FAILED]
    CANCEL_REQUESTED: [CANCELLED, INTERRUPTED, FAILED, UNKNOWN]
    VALIDATING: [PUBLISHING, INTERRUPTED, FAILED, CANCEL_REQUESTED, ROLLING_BACK]
    PUBLISHING: [SUCCEEDED, FAILED, UNKNOWN, ROLLING_BACK]
    SUCCEEDED: [ROLLING_BACK]
    INTERRUPTED: [ROLLING_BACK]
    FAILED: [ROLLING_BACK]
    ROLLING_BACK: [ROLLED_BACK, FAILED]
    ROLLED_BACK: []
    CANCELLED: [ROLLING_BACK]

cdc:
  initial: CREATED
  terminal_states: [STOPPED, FAILED]
  notes: "CDC is a continuous job and never transitions to batch SUCCEEDED. Recovery follows C+D policy."
  states:
    CREATED: [QUEUED, STOPPED, FAILED]
    QUEUED: [SUBMITTING, STOP_REQUESTED, STOPPED, FAILED]
    SUBMITTING: [INITIAL_SNAPSHOT, STREAMING, UNKNOWN, FAILED]
    UNKNOWN: [RECONCILING, FAILED, STOP_REQUESTED]
    RECONCILING: [INITIAL_SNAPSHOT, STREAMING, DEGRADED, STOPPED, FAILED, CHECKPOINT_LOST, POSITION_EXPIRED, UNKNOWN]
    INITIAL_SNAPSHOT: [STREAMING, DEGRADED, PAUSE_REQUESTED, STOP_REQUESTED, FAILED, CHECKPOINT_LOST, UNKNOWN]
    STREAMING: [DEGRADED, PAUSE_REQUESTED, STOP_REQUESTED, FAILED, CHECKPOINT_LOST, POSITION_EXPIRED, UNKNOWN]
    DEGRADED: [STREAMING, STOP_REQUESTED, FAILED, CHECKPOINT_LOST, POSITION_EXPIRED, RECOVERING]
    PAUSE_REQUESTED: [PAUSED, STREAMING, STOP_REQUESTED, FAILED]
    PAUSED: [STREAMING, STOP_REQUESTED, STOPPED, FAILED]
    CHECKPOINT_LOST: [RECOVERING, STOP_REQUESTED, STOPPED, FAILED]
    POSITION_EXPIRED: [RECOVERING, STOP_REQUESTED, STOPPED, FAILED]
    RECOVERING: [INITIAL_SNAPSHOT, STREAMING, FAILED, STOP_REQUESTED]
    STOP_REQUESTED: [STOPPED, FAILED, UNKNOWN]
    STOPPED: [RECOVERING]
    FAILED: [RECOVERING]
