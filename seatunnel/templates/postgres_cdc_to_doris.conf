# =============================================================================
# M8 独立 CDC 集成链路：PostgreSQL 16 CDC (Logical WAL / pgoutput) -> Apache Doris 2.1.7
# 引擎版本：Apache SeaTunnel Zeta 2.3.9
# 恢复策略：严格遵守 C+D 策略（DEC-010）；复制槽（slot.name）丢失或 WAL LSN 过期时，
#           必须进入 CHECKPOINT_LOST / POSITION_EXPIRED 并由 Operator 显式确认后方可恢复。
# 安全约束：零明文密码，所有凭据统一使用 ${SECRET:...} 占位符。
# =============================================================================

env {
  job.mode = "STREAMING"
  job.name = "m8_postgres_cdc_to_doris_customers_streaming"
  parallelism = 1
  checkpoint.interval = 10000
  checkpoint.timeout = 60000
}

source {
  PostgreSQL-CDC {
    base-url = "jdbc:postgresql://demo-postgres:5432/demo_pg_oltp"
    username = "etl_pg_cdc_reader"
    password = "${SECRET:POSTGRES_CDC_PASSWORD}"
    database-names = ["demo_pg_oltp"]
    schema-names = ["public"]
    table-names = ["public.customer_profiles"]
    decoding.plugin.name = "pgoutput"
    slot.name = "etl_agent_pg_cdc_slot"
    startup.mode = "initial"
    server-time-zone = "UTC"
    exactly_once = true
    result_table_name = "pg_cdc_customers_stream"
  }
}

transform {
  Sql {
    source_table_name = "pg_cdc_customers_stream"
    result_table_name = "doris_cdc_customers_clean"
    query = """
      SELECT
        customer_id,
        account_tier,
        country_code,
        is_active,
        updated_at
      FROM pg_cdc_customers_stream
      WHERE customer_id IS NOT NULL
    """
  }
}

sink {
  Doris {
    source_table_name = "doris_cdc_customers_clean"
    fenodes = "doris-fe:8030"
    query-port = 9030
    username = "etl_writer"
    password = "${SECRET:DORIS_SINK_PASSWORD}"
    database = "demo_dw"
    table = "ods_customer_profiles_pg_cdc"
    sink.label-prefix = "st_pg_cdc_doris"
    sink.enable-2pc = "true"
    sink.enable-delete = "true"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
