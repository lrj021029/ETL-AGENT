# =============================================================================
# M8 首要 CDC 链路：MySQL 8.0 CDC (Binlog ROW + GTID) -> Apache Doris 2.1.7 实时同步模板
# 引擎版本：Apache SeaTunnel Zeta 2.3.9
# 恢复策略：严格遵守 C+D 策略（DEC-010），位点丢失或过期时禁止静默重跑 initial 快照。
# 安全约束：零明文密码，所有凭据统一使用 ${SECRET:...} 占位符。
# =============================================================================

env {
  job.mode = "STREAMING"
  job.name = "m8_mysql_cdc_to_doris_orders_streaming"
  parallelism = 1
  checkpoint.interval = 10000
  checkpoint.timeout = 60000
}

source {
  MySQL-CDC {
    base-url = "jdbc:mysql://demo-mysql:3306/demo_oltp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username = "etl_cdc_reader"
    password = "${SECRET:MYSQL_CDC_PASSWORD}"
    database-names = ["demo_oltp"]
    table-names = ["demo_oltp.orders"]
    startup.mode = "initial"
    stop.mode = "never"
    server-id = "5400-5408"
    server-time-zone = "UTC"
    exactly_once = true
    result_table_name = "mysql_cdc_orders_stream"
  }
}

transform {
  Sql {
    source_table_name = "mysql_cdc_orders_stream"
    result_table_name = "doris_cdc_orders_clean"
    query = """
      SELECT
        order_id,
        user_id,
        order_status,
        total_amount,
        currency_code,
        updated_at
      FROM mysql_cdc_orders_stream
      WHERE order_id IS NOT NULL
    """
  }
}

sink {
  # Doris Unique Key 表支持 CDC Upsert 与 Delete 事件同步 (sink.enable-delete = true)
  Doris {
    source_table_name = "doris_cdc_orders_clean"
    fenodes = "doris-fe:8030"
    query-port = 9030
    username = "etl_writer"
    password = "${SECRET:DORIS_SINK_PASSWORD}"
    database = "demo_dw"
    table = "ods_orders_cdc_realtime"
    sink.label-prefix = "st_mysql_cdc_doris"
    sink.enable-2pc = "true"
    sink.enable-delete = "true"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
